name: Pentaho pull request workflow
on:
  workflow_call:
    inputs:
      container_image:
        type: string
        required: false
        description: "Image to be used"
      slack_channels:
        type: string
        required: false
        description: "Slack channel(s) to send notifications to."
      sonar_project_key:
        type: string
        required: false
        description: "Sonar's project identifier key"
      ms_teams_webhook_secret_name:
        type: string
        required: false
        default: ""
        description: "The MS Teams webhook secret name"

env:
  SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key || github.event.repository.name }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_LOGIN: ${{secrets.WINGMAN_SONAR_TOKEN}}

  NPM_REGISTRY: //${{ vars.ARTIFACTORY_HOST }}/artifactory/api/npm/npm/

  SLACK_CHANNEL: "${{ inputs.slack_channels }}"

  npm_config_loglevel: "verbose"

jobs:
  check-commit-messages:
    name: Check Commit Messages
    uses: pentaho/actions-common/.github/workflows/check.yml@stable
    secrets: inherit

    permissions:
      statuses: write
      checks: write
      contents: write
      pull-requests: write
      actions: write

  common-job:
    name: Common Checks
    runs-on: [ k8s, orl-lab ]

    permissions:
      statuses: write
      checks: write
      contents: write
      pull-requests: write
      actions: write

    container:
      image: ${{ inputs.container_image || vars.PDIA_AC_CONTAINER_IMAGE }}
      credentials:
        username: ${{ secrets.PENTAHO_CICD_ONE_USER }}
        password: ${{ secrets.PENTAHO_CICD_ONE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.HV_ACTIONS_GIT_TOKEN }}

      - name: Configure Git
        uses: pentaho/actions-common/.github/actions/git-config@stable

      - name: NPM authentication
        uses: pentaho/actions-common/.github/actions/npm-registry-auth@stable
        with:
          pentaho_registry: ${{ env.NPM_REGISTRY }}
          username: ${{ secrets.PENTAHO_CICD_ONE_USER }}
          password: ${{ secrets.PENTAHO_CICD_ONE_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run --if-present build

      - name: Run tests
        run: npm run --if-present test

      - name: Sonarqube scan
        id: Sonarqube
        uses: lumada-common-services/gh-composite-actions@stable
        env:
          sonar_utility: sonar-scanner
          sonar_commands: '("-Dsonar.links.scm=https://github.com/${{ github.repository }}" -Dsonar.projectKey=${{env.SONAR_PROJECT_KEY}} -Dsonar.host.url=${{env.SONAR_HOST_URL}} -Dsonar.token=${{env.SONAR_LOGIN}} -Dsonar.pullrequest.key=${{github.event.number}} -Dsonar.pullrequest.branch=${{github.event.pull_request.head.ref}} -Dsonar.pullrequest.base=${{github.event.pull_request.base.ref}}")'

      - name: FrogBot scan
        uses: lumada-common-services/gh-composite-actions@stable
        env:
          JF_URL: https://${{ vars.ARTIFACTORY_HOST }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.HV_ACTIONS_GIT_TOKEN }}
          GIT_REPO_OWNER: ${{ github.repository_owner }}
          GIT_REPO_NAME: ${{ github.event.repository.name }}
          JF_PATH_EXCLUSIONS: "*.git*;*node_modules*;*dist*;*build*;*coverage*;*.next*;*.nuxt*;*test*"
          PULL_REQUEST_NUMBER: ${{github.event.number}}

      - name: Report notifications
        if: always()
        uses: lumada-common-services/gh-composite-actions@stable
        env:
          Slack_Token: ${{ secrets.SLACK_TOKEN }}
          Slack_Channel: ${{ env.SLACK_CHANNEL }}
          teams_Webhook_Url: ${{ secrets[inputs.ms_teams_webhook_secret_name] }}
          steps_json: ${{ toJson(steps) }}
          report: true
