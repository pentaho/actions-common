name: Pentaho build plugins workflow
on:
  workflow_call:
    inputs:
      additional_mvn_directives:
        type: string
        required: false
        default: ""
        description: "Additional directives for the Maven command (e.g. -f <pom> -pl <modules> -am)"
      run_unit_tests:
        type: boolean
        required: false
        default: false
        description: "Run and report the unit tests (the caller must grant 'checks: write')"
      post_build_command:
        type: string
        required: false
        default: ""
        description: "Optional bash commands run after the build; $MAVEN_SETTINGS_FILE and $PLUGINS_DIR (the uploaded system folder) are set"
      node_version:
        type: string
        required: false
        default: ""
        description: "Optional Node version installed before npm configuration, Maven and post_build_command"
      sonar_project_key:
        type: string
        required: false
        default: ""
        description: "SonarQube project key; empty skips the scan. Pull request parameters are only sent on pull_request events"
      frogbot_scan:
        type: boolean
        required: false
        default: false
        description: "Run the FrogBot scan on pull_request events; a -pl in additional_mvn_directives limits the scanned modules"
      artifact_retention_days:
        type: number
        required: false
        default: 5
        description: "Retention in days for the uploaded plugins artifact"
      timeout_minutes:
        type: number
        required: false
        default: 60
        description: "Timeout of the build job"
      container_image:
        type: string
        required: false
        description: "Image to be used"
      verbose:
        type: boolean
        required: false
        default: false
        description: "Print tool versions and staged plugin details (normal command output is always visible)"

env:
  RESOLVE_REPO_MIRROR: https://${{ vars.ARTIFACTORY_HOST }}/artifactory/pnt-mvn
  NPM_REGISTRY: //${{ vars.ARTIFACTORY_HOST }}/artifactory/api/npm/npm/

  NEXUS_DEPLOY_USER: ${{ secrets.PENTAHO_CICD_ONE_USER }}
  NEXUS_DEPLOY_PASSWORD: ${{ secrets.PENTAHO_CICD_ONE_KEY }}

  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_LOGIN: ${{ secrets.WINGMAN_SONAR_TOKEN }}

jobs:
  build:
    name: Build and stage plugins
    runs-on: [ k8s, orl-lab ]
    timeout-minutes: ${{ inputs.timeout_minutes }}

    container:
      image: ${{ inputs.container_image || vars.PDIA_AC_CONTAINER_IMAGE }}
      credentials:
        username: ${{ secrets.PENTAHO_CICD_ONE_USER }}
        password: ${{ secrets.PENTAHO_CICD_ONE_KEY }}
      volumes:
        - /home/runner/caches/pentaho/.m2:/root/.m2

    steps:
      - name: Set up Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Retrieve settings file
        id: common-maven
        uses: pentaho/actions-common@stable

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.HV_ACTIONS_GIT_TOKEN || github.token }}
          persist-credentials: false

      - name: Configure npm workspace
        uses: pentaho/actions-common/.github/actions/setup-plugin-npm@stable
        with:
          registry: ${{ env.NPM_REGISTRY }}
          username: ${{ secrets.PENTAHO_CICD_ONE_USER }}
          password: ${{ secrets.PENTAHO_CICD_ONE_KEY }}
          verbose: ${{ inputs.verbose }}

      - name: Build
        uses: pentaho/actions-common/.github/actions/build-plugins@stable
        with:
          settings_file: ${{ steps.common-maven.outputs.settings-file-path }}
          additional_mvn_directives: ${{ inputs.additional_mvn_directives }}
          run_unit_tests: ${{ inputs.run_unit_tests }}
          post_build_command: ${{ inputs.post_build_command }}
          verbose: ${{ inputs.verbose }}

      - name: Sonarqube scan
        if: ${{ inputs.sonar_project_key != '' }}
        uses: pentaho/actions-common/.github/actions/sonarqube-scan@stable
        with:
          project_key: ${{ inputs.sonar_project_key }}
          host_url: ${{ env.SONAR_HOST_URL }}
          token: ${{ env.SONAR_LOGIN }}
          pull_request: ${{ github.event_name == 'pull_request' }}

      - name: FrogBot scan
        if: ${{ inputs.frogbot_scan && github.event_name == 'pull_request' }}
        uses: pentaho/actions-common/.github/actions/frogbot-scan@stable
        with:
          artifactory_url: https://${{ vars.ARTIFACTORY_HOST }}
          access_token: ${{ secrets.JF_ACCESS_TOKEN }}
          git_token: ${{ secrets.HV_ACTIONS_GIT_TOKEN }}
          maven_mode: directives
          maven_directives: ${{ inputs.additional_mvn_directives }}

      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: pentaho-plugins
          path: pentaho-build/pentaho-solutions/system/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
