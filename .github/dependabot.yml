version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "cardosov"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
